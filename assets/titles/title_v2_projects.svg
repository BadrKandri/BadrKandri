  <!-- Accent Fading Lines -->
  <line x1="24" y1="23" x2="304" y2="23" stroke="url(#fade-left-projects)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="476" y1="23" x2="756" y2="23" stroke="url(#fade-right-projects)" stroke-width="1.2" stroke-linecap="round"/>

