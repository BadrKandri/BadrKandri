<svg width="780" height="46" viewBox="0 0 780 46" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fade-left-neetcode" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="fade-right-neetcode" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill-bg-neetcode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <filter id="glow-neetcode" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#A855F7" flood-opacity="0.55"/>
    </filter>
    <filter id="comet-neetcode" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#A855F7" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Accent Fading Lines -->
  <line x1="24" y1="23" x2="250" y2="23" stroke="url(#fade-left-neetcode)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="530" y1="23" x2="756" y2="23" stroke="url(#fade-right-neetcode)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Inward Traveling Energy Stream (Left -> Capsule) -->
  <circle cy="23" r="2" fill="#A855F7" filter="url(#comet-neetcode)">
    <animate attributeName="cx" values="24;250" dur="2.5s" repeatCount="indefinite" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.5s" repeatCount="indefinite" keyTimes="0;0.2;0.8;1"/>
  </circle>

  <!-- Inward Traveling Energy Stream (Right -> Capsule) -->
  <circle cy="23" r="2" fill="#A855F7" filter="url(#comet-neetcode)">
    <animate attributeName="cx" values="756;530" dur="2.5s" repeatCount="indefinite" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.5s" repeatCount="indefinite" keyTimes="0;0.2;0.8;1"/>
  </circle>

  <!-- Center Capsule with Breathing Border -->
  <rect x="264" y="6" width="252" height="34" rx="17" fill="url(#pill-bg-neetcode)" stroke="#A855F7" stroke-opacity="0.38" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.3;0.65;0.3" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Glowing Radar Beacon Dot -->
  <circle cx="282" cy="23" r="3" fill="none" stroke="#A855F7" stroke-width="0.8">
    <animate attributeName="r" values="3;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="282" cy="23" r="3" fill="#A855F7" filter="url(#glow-neetcode)">
    <animate attributeName="r" values="3;3.6;3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Icon & Text Group -->
  <g transform="translate(294, 23)">
    <path d="M6 1H9V3C10 3 11 4 11 5C11 6 10 7 9 7V9H7C7 8 6 7 5 7C4 7 3 8 3 9H1V6C2 6 3 5 3 4C3 3 2 2 1 2V1H4C4 2 5 3 6 3C7 3 8 2 8 1H6Z" stroke="#A855F7" stroke-width="1.2" fill="#A855F7" fill-opacity="0.2" stroke-linejoin="round" transform="translate(0, -6)"/>
    <text x="22" y="4" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1px">
      NEETCODE 150 ROADMAP
    </text>
  </g>
</svg>