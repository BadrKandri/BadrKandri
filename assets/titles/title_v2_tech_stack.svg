<svg width="780" height="46" viewBox="0 0 780 46" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fade-left-tech_stack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00EA64" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00EA64" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="fade-right-tech_stack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00EA64" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#00EA64" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill-bg-tech_stack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <filter id="glow-tech_stack" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00EA64" flood-opacity="0.55"/>
    </filter>
    <filter id="comet-tech_stack" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00EA64" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Accent Fading Lines -->
  <line x1="24" y1="23" x2="232" y2="23" stroke="url(#fade-left-tech_stack)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="548" y1="23" x2="756" y2="23" stroke="url(#fade-right-tech_stack)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Inward Traveling Energy Stream (Left -> Capsule) -->
  <circle cy="23" r="2" fill="#00EA64" filter="url(#comet-tech_stack)">
    <animate attributeName="cx" values="24;232" dur="2.5s" repeatCount="indefinite" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.5s" repeatCount="indefinite" keyTimes="0;0.2;0.8;1"/>
  </circle>

  <!-- Inward Traveling Energy Stream (Right -> Capsule) -->
  <circle cy="23" r="2" fill="#00EA64" filter="url(#comet-tech_stack)">
    <animate attributeName="cx" values="756;548" dur="2.5s" repeatCount="indefinite" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.5s" repeatCount="indefinite" keyTimes="0;0.2;0.8;1"/>
  </circle>

  <!-- Center Capsule with Breathing Border -->
  <rect x="246" y="6" width="288" height="34" rx="17" fill="url(#pill-bg-tech_stack)" stroke="#00EA64" stroke-opacity="0.38" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.3;0.65;0.3" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Glowing Radar Beacon Dot -->
  <circle cx="264" cy="23" r="3" fill="none" stroke="#00EA64" stroke-width="0.8">
    <animate attributeName="r" values="3;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="264" cy="23" r="3" fill="#00EA64" filter="url(#glow-tech_stack)">
    <animate attributeName="r" values="3;3.6;3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Icon & Text Group -->
  <g transform="translate(276, 23)">
    <path d="M7 0L0 3.5L7 7L14 3.5L7 0ZM0 7.5L7 11L14 7.5M0 11.5L7 15L14 11.5" stroke="#00EA64" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(0, -8)"/>
    <text x="22" y="4" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1px">
      TECH STACK &amp; COMPETENCIES
    </text>
  </g>
</svg>