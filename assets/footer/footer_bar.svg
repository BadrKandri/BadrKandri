<svg width="780" height="50" viewBox="0 0 780 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="50%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="bar-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00EA64" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00EA64" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="brand-grad-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00EA64"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="heart-glow-bar" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#EF4444" flood-opacity="0.6"/>
    </filter>
    <filter id="dot-glow-bar" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00EA64" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="778" height="48" rx="14" fill="url(#bar-bg)" stroke="url(#bar-border)" stroke-width="1.2"/>

  <!-- Ambient Light Corner Glows -->
  <circle cx="30" cy="25" r="45" fill="#00EA64" opacity="0.04"/>
  <circle cx="750" cy="25" r="45" fill="#38BDF8" opacity="0.04"/>

  <!-- Left: System Status Dot -->
  <g transform="translate(24, 16)">
    <circle cx="4" cy="9" r="2.5" fill="#00EA64" filter="url(#dot-glow-bar)"/>
    <text x="14" y="12.5" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5px">
      OPEN TO CONNECT
    </text>
  </g>

  <!-- Right: Location / Year -->
  <g transform="translate(636, 16)">
    <text x="0" y="12.5" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5px">
      CASABLANCA · 2026
    </text>
  </g>

  <!-- Center Content -->
  <g transform="translate(258, 16)">
    <!-- Designed & maintained with -->
    <text x="0" y="12.5" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">
      Designed &amp; maintained with
    </text>
    
    <!-- Heart Icon -->
    <g transform="translate(152, 1)">
      <path d="M6 10.5L5.13 9.71C2.06 6.93 0.03 5.09 0.03 2.82C0.03 0.98 1.48 -0.47 3.32 -0.47C4.36 -0.47 5.36 0.01 6 0.77C6.64 0.01 7.64 -0.47 8.68 -0.47C10.52 -0.47 11.97 0.98 11.97 2.82C11.97 5.09 9.94 6.93 6.87 9.71L6 10.5Z" fill="#EF4444" filter="url(#heart-glow-bar)"/>
    </g>

    <!-- by Badr Kandri -->
    <text x="172" y="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      <tspan fill="#94A3B8" font-weight="400">by </tspan>
      <tspan fill="url(#brand-grad-bar)" font-weight="700">Badr Kandri</tspan>
    </text>
  </g>
</svg>