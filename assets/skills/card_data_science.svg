<svg width="390" height="182" viewBox="0 0 390 182" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-data_science" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="50%" stop-color="#0E1422" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="border-grad-data_science" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5">
        <animate attributeName="stop-opacity" values="0.35;0.65;0.35" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-data_science" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="388" height="180" rx="14" fill="url(#bg-grad-data_science)" stroke="url(#border-grad-data_science)" stroke-width="1.2" />

  <!-- Ambient Light Corner Glow with Breathing -->
  <circle cx="28" cy="28" r="50" fill="#38BDF8" opacity="0.06">
    <animate attributeName="opacity" values="0.04;0.10;0.04" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Header: Category Icon + Title -->
