<svg width="390" height="185" viewBox="0 0 390 185" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-mlops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="50%" stop-color="#0E1422" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad-mlops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00EA64" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#00EA64" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-mlops" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00EA64" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="388" height="183" rx="14" fill="url(#bg-grad-mlops)" stroke="url(#border-grad-mlops)" stroke-width="1.2" />

  <!-- Ambient Light Corner Glow -->
  <circle cx="28" cy="28" r="50" fill="#00EA64" opacity="0.06" />

  <!-- Header: Category Icon + Title -->
  <g transform="translate(18, 16)">
    <!-- Category Icon -->
    <g transform="translate(0, 1)">
      
          <rect x="2" y="3" width="16" height="13" rx="2" stroke="#00EA64" stroke-width="1.4" fill="#00EA64" fill-opacity="0.1"/>
          <path d="M6 7.5L9 9.5L6 11.5" stroke="#00EA64" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M11 11.5H14" stroke="#00EA64" stroke-width="1.3" stroke-linecap="round"/>
        
    </g>

    <!-- Title -->
    <text x="26" y="14" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" letter-spacing="-0.2px">
      MLOps &amp; Core Engineering
    </text>
  </g>

  <!-- Domain Pill Badge -->
  <g transform="translate(18, 38)">
    <rect x="0" y="0" width="111.0" height="17" rx="8.5" fill="#00EA64" fill-opacity="0.1" stroke="#00EA64" stroke-opacity="0.3" stroke-width="0.8"/>
    <circle cx="8" cy="8.5" r="2.5" fill="#00EA64" filter="url(#glow-mlops)"/>
    <text x="16" y="12" fill="#00EA64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.3px">
      CODING &amp; MLOPS
    </text>
  </g>

  <!-- Subtitle / Focus Summary -->
  <text x="18" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">
    Containerization, Microservices &amp; CI/CD Pipelines
  </text>

  <!-- Divider Line -->
  <line x1="18" y1="78" x2="372" y2="78" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Skill Badges Grid -->
  
            <g transform="translate(18, 92)">
