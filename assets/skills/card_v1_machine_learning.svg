      <stop offset="40%" stop-color="#F97316" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-machine_learning" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#F97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="388" height="183" rx="14" fill="url(#bg-grad-machine_learning)" stroke="url(#border-grad-machine_learning)" stroke-width="1.2" />

  <!-- Ambient Light Corner Glow -->
  <circle cx="28" cy="28" r="50" fill="#F97316" opacity="0.06" />

  <!-- Header: Category Icon + Title -->
  <g transform="translate(18, 16)">
