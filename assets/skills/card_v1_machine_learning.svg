          <circle cx="11" cy="14" r="2" fill="#F97316"/>
          <circle cx="18" cy="5" r="2.2" fill="#F97316"/>
          <path d="M2 19H19" stroke="#F97316" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
        
    </g>

    <!-- Title -->
    <text x="26" y="14" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" letter-spacing="-0.2px">
      Machine Learning &amp; Data Science
    </text>
  </g>

  <!-- Domain Pill Badge -->
