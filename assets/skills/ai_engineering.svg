<svg width="390" height="185" viewBox="0 0 390 185" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-ai_engineering" x1="0%" y1="0%" x2="100%" y2="100%">
