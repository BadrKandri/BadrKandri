    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="388" height="183" rx="14" fill="url(#bg-grad-ai_engineering)" stroke="url(#border-grad-ai_engineering)" stroke-width="1.2" />

  <!-- Ambient Light Corner Glow -->
  <circle cx="28" cy="28" r="50" fill="#38BDF8" opacity="0.06" />

  <!-- Header: Category Icon + Title -->
  <g transform="translate(18, 16)">
