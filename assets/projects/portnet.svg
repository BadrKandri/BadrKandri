<svg width="295" height="136" viewBox="0 0 295 136" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient matching HackerRank card -->
    <linearGradient id="bg-grad-portnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="50%" stop-color="#0E1422" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>

    <!-- Border Gradient with Emerald/Cyan touch -->
    <linearGradient id="border-grad-portnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#00EA64" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-portnet" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="293" height="134" rx="14" fill="url(#bg-grad-portnet)" stroke="url(#border-grad-portnet)" stroke-width="1.2" />

  <!-- Ambient Light Corner Glow -->
  <circle cx="25" cy="25" r="45" fill="#38BDF8" opacity="0.06" />

  <!-- Header: Icon + Title + Domain Badge -->
  <g transform="translate(16, 16)">
    <!-- Repo Book Icon -->
    <g transform="translate(0, 1)">
      <path d="M2 1.5C2 0.67 2.67 0 3.5 0H12.5C13.33 0 14 0.67 14 1.5V12C14 12.83 13.33 13.5 12.5 13.5H3.5C2.67 13.5 2 12.83 2 12V1.5Z" stroke="#38BDF8" stroke-width="1.5" fill="none"/>
      <path d="M5 4H11M5 7H9" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- Title -->
    <text x="22" y="12" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="-0.2px">
      PortNet-Predictive..
    </text>

    <!-- External Link Arrow -->
    <g transform="translate(249, 2)">
      <path d="M1 9L9 1M9 1H3M9 1V7" stroke="#64748B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Domain Tag / Category Pill -->
  <g transform="translate(16, 38)">
    <rect x="0" y="0" width="124.0" height="17" rx="8.5" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="0.8"/>
    <circle cx="8" cy="8.5" r="2.5" fill="#38BDF8" filter="url(#glow-portnet)"/>
    <text x="16" y="12" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.3px">
      MACHINE LEARNING
    </text>
  </g>

  <!-- Description (2 lines) -->
  <g transform="translate(16, 68)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">
      Predictive analytics &amp; feature engineering for
    </text>
    <text x="0" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">
      maritime logistics and port operations.
    </text>
  </g>

  <!-- Footer Tags -->
  
        <g transform="translate(16, 104)">
            <rect x="0" y="0" width="53.0" height="18" rx="9" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="0.8"/>
            <text x="26.5" y="12.5" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500">
                Python
            </text>
        </g>
        
        <g transform="translate(75.0, 104)">
            <rect x="0" y="0" width="46.5" height="18" rx="9" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="0.8"/>
            <text x="23.25" y="12.5" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500">
                NumPy
            </text>
        </g>
        
        <g transform="translate(127.5, 104)">
            <rect x="0" y="0" width="59.5" height="18" rx="9" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="0.8"/>
            <text x="29.75" y="12.5" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500">
                Jupyter
            </text>
        </g>
        
</svg>
