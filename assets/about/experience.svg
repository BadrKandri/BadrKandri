<svg width="390" height="205" viewBox="0 0 390 205" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="about-exp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="50%" stop-color="#0E1422" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>
    <linearGradient id="about-exp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#F97316" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow-exp" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#F97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="388" height="203" rx="14" fill="url(#about-exp-bg)" stroke="url(#about-exp-border)" stroke-width="1.2" />
  <circle cx="28" cy="28" r="50" fill="#F97316" opacity="0.06" />

  <!-- Header -->
  <g transform="translate(18, 16)">
    <!-- Briefcase / Industry Icon -->
    <rect x="2" y="5" width="18" height="13" rx="2" stroke="#F97316" stroke-width="1.4" fill="#F97316" fill-opacity="0.15"/>
    <path d="M7 5V3.5C7 2.67 7.67 2 8.5 2H13.5C14.33 2 15 2.67 15 3.5V5" stroke="#F97316" stroke-width="1.3"/>
    <circle cx="11" cy="11.5" r="1.5" fill="#F97316"/>

    <text x="28" y="14" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">
