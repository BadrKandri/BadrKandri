    <circle cx="8" cy="8.5" r="2.5" fill="#F97316" filter="url(#glow-exp)"/>
    <text x="16" y="12" fill="#F97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.3px">
