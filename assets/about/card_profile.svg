<svg width="390" height="205" viewBox="0 0 390 205" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="about-prof-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="50%" stop-color="#0E1422" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>
    <linearGradient id="about-prof-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow-prof" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="388" height="203" rx="14" fill="url(#about-prof-bg)" stroke="url(#about-prof-border)" stroke-width="1.2" />
  <circle cx="28" cy="28" r="50" fill="#38BDF8" opacity="0.06" />

  <!-- Header -->
  <g transform="translate(18, 16)">
    <!-- Academic Cap Icon -->
    <path d="M2 7L11 2L20 7L11 12L2 7Z" stroke="#38BDF8" stroke-width="1.4" stroke-linejoin="round" fill="#38BDF8" fill-opacity="0.2"/>
    <path d="M5.5 9V14C5.5 16.5 8 18 11 18C14 18 16.5 16.5 16.5 14V9" stroke="#38BDF8" stroke-width="1.3"/>
    <path d="M20 7V13" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>

    <text x="28" y="14" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">
      Academic &amp; Research Focus
    </text>
  </g>

  <!-- Domain Pill -->
  <g transform="translate(18, 40)">
    <rect x="0" y="0" width="132" height="17" rx="8.5" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="0.8"/>
    <circle cx="8" cy="8.5" r="2.5" fill="#38BDF8" filter="url(#glow-prof)"/>
    <text x="16" y="12" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.3px">
      DATA &amp; AI ENGINEERING
    </text>
  </g>

  <!-- Divider -->
  <line x1="18" y1="67" x2="372" y2="67" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Point 1 -->
  <g transform="translate(18, 77)">
    <circle cx="4" cy="9" r="2.5" fill="#38BDF8"/>
    <text x="14" y="9" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">
      5th Year State Engineer
    </text>
    <text x="14" y="23" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400">
      ENSA Berrechid (Information Systems &amp; Big Data)
    </text>
  </g>

  <!-- Point 2 -->
  <g transform="translate(18, 117)">
    <circle cx="4" cy="9" r="2.5" fill="#38BDF8"/>
    <text x="14" y="9" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">
      Autonomous Agents &amp; RAG
    </text>
    <text x="14" y="23" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400">
      Multi-agent workflows (LangGraph, Agno) &amp; Qdrant RAG
    </text>
  </g>

  <!-- Point 3 -->
  <g transform="translate(18, 157)">
    <circle cx="4" cy="9" r="2.5" fill="#38BDF8"/>
    <text x="14" y="9" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">
      First-Principles Machine Learning
    </text>
    <text x="14" y="23" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400">
      Algorithms recreated from scratch using pure vector math
    </text>
