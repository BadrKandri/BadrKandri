name: Update Visualizers (HackerRank & NeetCode)

on:
  schedule:
    - cron: "0 3 * * *"   # runs every day at 03:00 UTC
  workflow_dispatch:       # manual one-click run in GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate HackerRank card
        env:
          HACKERRANK_USERNAME: "badr_kandri_10"
          OUTPUT_PATH: "assets/hackerrank-dashboard.svg"
        run: |
          python .github/scripts/generate_hackerrank_card.py
          cp assets/hackerrank-dashboard.svg assets/hackerrank-card.svg

      - name: Generate NeetCode 150 card
        run: |
          python .github/scripts/generate_neetcode_card.py

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/hackerrank-dashboard.svg assets/hackerrank-card.svg assets/neetcode/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update HackerRank & NeetCode cards [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
