# Put this file at: .github/workflows/profile-visualizers.yml
# in your profile repository (the repo named exactly like your GitHub username).
#
# It runs once a day (and whenever you click "Run workflow" in the Actions tab),
# reads your public HackerRank profile and commits an updated card to assets/.
#
# Note: this uses a small third-party action and gives it write access to this repo.
# Read its code first, or pin it to a commit SHA instead of @v1.

name: Update HackerRank card

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # manual one-click run

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate HackerRank card
        uses: Tharun4743/github-profile-visualizer@v1
        with:
          username: ${{ github.repository_owner }}
          visualizers: 'all'
          theme: 'ocean-light'
          hackerrank-username: badr_kandri_10
          output-dir: 'assets'
          filename: 'profile-3d-city.svg'

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update HackerRank card [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
